# Inštalátor pre Windows pri každej verzii (tag v1.2.3): testy, zostavenie, Release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v6

      # Každý príkaz má vlastný krok: pwsh berie do úvahy len exit kód posledného
      # príkazu v skripte, takže pád pytest by inak prekryl úspešný npm test.
      - name: Závislosti frontend
        working-directory: frontend
        run: npm ci

      - name: Závislosti backend
        working-directory: backend
        run: uv sync

      - name: Testy backend
        working-directory: backend
        run: uv run pytest -q

      - name: Testy frontend
        working-directory: frontend
        run: npm test

      - name: Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      # Tag musí byť verzia appky z backend/pyproject.toml, inak build.ps1 skončí
      # (appka podľa verzie zálohuje databázu pri aktualizácii). Bez tagu ide jej verzia.
      - name: Zostavenie
        run: |
          $appVersion = (Select-String -Path backend\pyproject.toml -Pattern '^version = "(.+)"$' | Select-Object -First 1).Matches[0].Groups[1].Value
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { $appVersion }
          powershell -ExecutionPolicy Bypass -File scripts\build.ps1 -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: MojeKocky-Setup
          path: build/installer/*.exe

      # Text vydania je docs/release-notes/<tag>.md (napr. v1.0.0.md, SK a pod ním EN);
      # keď k tagu chýba, Release dostane všeobecný docs/release-notes/default.md.
      - name: Text vydania
        id: notes
        if: github.ref_type == 'tag'
        run: |
          $notes = "docs/release-notes/$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path $notes)) {
            Write-Warning "Chýba $notes, Release dostane všeobecný text."
            $notes = "docs/release-notes/default.md"
          }
          "path=$notes" >> $env:GITHUB_OUTPUT

      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: build/installer/*.exe
          body_path: ${{ steps.notes.outputs.path }}
